source: https://github.com/julioborgesigt/distribuidorfull

features:
  - node lts

passenger:
  enabled: "on"
  # Passenger procura app.js na raiz por padrão — app.js delega para backend/server.js
  app_start_command: node app.js
  env_var_list:
    # IMPORTANTE: Substitua os valores abaixo pelas suas credenciais reais
    # no painel do DomCloud. NUNCA commite credenciais reais no repositório.
    - JWT_SECRET=${JWT_SECRET}
    - DB_HOST=${DB_HOST}
    - DB_USER=${DB_USER}
    - DB_PASS=${DB_PASS}
    - DB_NAME=${DB_NAME}
    - FRONTEND_URL=${FRONTEND_URL}
    - NODE_ENV=production

commands:
  # 1. Cria backend/.env a partir de variáveis de ambiente do servidor
  #    Configure as variáveis reais no painel do DomCloud (Environment Variables)
  - |
    cat > backend/.env <<EOF
    JWT_SECRET=${JWT_SECRET}
    DB_HOST=${DB_HOST}
    DB_USER=${DB_USER}
    DB_PASS=${DB_PASS}
    DB_NAME=${DB_NAME}
    FRONTEND_URL=${FRONTEND_URL}
    NODE_ENV=production
    EOF
  # 2. Instala dependências do backend
  - npm install --prefix backend
  # 3. Instala dependências do frontend e gera o build
  - npm install --prefix frontend
  - npm run build --prefix frontend
  # 4. Garante que a pasta de logs existe para o Winston
  - mkdir -p backend/logs
  # 5. Reinicia o Passenger
  - mkdir -p backend/tmp && touch backend/tmp/restart.txt
