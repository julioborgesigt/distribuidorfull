source: https://github.com/julioborgesigt/distribuidorfull

features:
  - node lts

passenger:
  enabled: "on"
  # app_root aponta para backend/ onde está o server.js
  # O caminho '../frontend/dist' dentro do server.js resolve corretamente a partir daqui
  app_root: backend
  app_start_command: node server.js
  env_var_list:
    - JWT_SECRET=b7f8a2d4e3f7c78e8e9a3d0b5f6d8a3e7c9f2b8e4d1a5c0e2d3f9b6a7d8e4c1f
    - DB_HOST=sao.domcloud.co
    - DB_USER=distribuidor
    - DB_PASS=-C)W1aQ6nG9(Vbr1s7
    - DB_NAME=distribuidor_proc
    - FRONTEND_URL=https://SEU_DOMINIO.domcloud.dev
    - NODE_ENV=production

commands:
  # 1. Instala dependências e gera o build do Vue (frontend/dist/)
  - cd frontend && npm install && npm run build
  # 2. Instala dependências do backend
  - cd backend && npm install
  # 3. Garante que a pasta de logs existe para o Winston
  - mkdir -p backend/logs
  # 4. Reinicia o Passenger
  - mkdir -p backend/tmp && touch backend/tmp/restart.txt
