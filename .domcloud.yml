# Deploy no DOM Cloud.
#
# O frontend é buildado no GitHub Actions (.github/workflows/build-deploy-branch.yml),
# que publica o código + frontend/dist na branch "deploy". Aqui apenas clonamos essa
# branch e instalamos o backend — o servidor NÃO roda mais `vite build` (estourava o
# limite de memória do runner do DOM Cloud).
source:
  url: https://github.com/julioborgesigt/distribuidorfull
  branch: deploy

features:
  - node lts

passenger:
  enabled: "on"
  # Passenger procura app.js na raiz por padrão — app.js delega para backend/server.js
  app_start_command: node app.js
  env_var_list:
    # IMPORTANTE: configure os valores reais no painel do DomCloud (Environment Variables).
    # NUNCA commite credenciais reais no repositório.
    # DB_HOST deve ser "localhost": o MySQL do DOM Cloud roda na mesma máquina e o
    # usuário do banco só tem permissão para conexões locais.
    # PJE_CRED_ENC_KEY: chave AES-256 (base64, 32 bytes) usada para criptografar as
    # credenciais do PJe no banco — sem ela a tela "Autenticação PJe" não funciona.
    # Gere com: openssl rand -base64 32
    - JWT_SECRET=${JWT_SECRET}
    - JWT_EXPIRATION=${JWT_EXPIRATION}
    - DB_HOST=${DB_HOST}
    - DB_USER=${DB_USER}
    - DB_PASS=${DB_PASS}
    - DB_NAME=${DB_NAME}
    - FRONTEND_URL=${FRONTEND_URL}
    - PJE_CRED_ENC_KEY=${PJE_CRED_ENC_KEY}
    # Super admin global (multi-unidade). Definido no painel do DomCloud.
    # Na 1ª execução cria o usuário; nas seguintes apenas garante o papel.
    # A senha nunca é registrada em log; troque-a pelo painel após o 1º acesso.
    - SUPER_ADMIN_MATRICULA=${SUPER_ADMIN_MATRICULA}
    - SUPER_ADMIN_NOME=${SUPER_ADMIN_NOME}
    - SUPER_ADMIN_SENHA=${SUPER_ADMIN_SENHA}
    - NODE_ENV=production

commands:
  # 1. Cria backend/.env a partir das variáveis de ambiente do servidor
  - |
    cat > backend/.env <<EOF
    JWT_SECRET=$JWT_SECRET
    JWT_EXPIRATION=$JWT_EXPIRATION
    DB_HOST=$DB_HOST
    DB_USER=$DB_USER
    DB_PASS=$DB_PASS
    DB_NAME=$DB_NAME
    FRONTEND_URL=$FRONTEND_URL
    PJE_CRED_ENC_KEY=$PJE_CRED_ENC_KEY
    SUPER_ADMIN_MATRICULA=$SUPER_ADMIN_MATRICULA
    SUPER_ADMIN_NOME=$SUPER_ADMIN_NOME
    SUPER_ADMIN_SENHA=$SUPER_ADMIN_SENHA
    NODE_ENV=production
    EOF
  - sed -i 's/^[[:space:]]*//' backend/.env
  # Variáveis vazias (não configuradas no painel) não atrapalham: o app trata
  # string vazia como ausente e usa os defaults.
  # 2. Instala as dependências de produção EXATAMENTE como no package-lock.json
  # (npm ci garante que produção usa as versões auditadas, ao contrário do npm install)
  - npm ci --omit=dev --prefix backend
  # 3. Aplica migrations de schema pendentes (substitui o antigo sequelize.sync)
  - npm run db:migrate --prefix backend
  # 4. Semeia/atualiza a lista de unidades (delegacias) — idempotente
  - npm run db:seed:unidades --prefix backend
  # 5. Garante o super admin global a partir das variáveis SUPER_ADMIN_* — idempotente
  - npm run ensure:super --prefix backend
  # 6. Garante que a pasta de logs existe para o Winston
  - mkdir -p backend/logs
  # 7. Reinicia o Passenger (restart.txt na raiz do app)
  - mkdir -p tmp && touch tmp/restart.txt
