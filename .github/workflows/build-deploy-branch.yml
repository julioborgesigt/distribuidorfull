# Builda o frontend no GitHub Actions e publica o resultado na branch "deploy".
# O DOM Cloud clona a branch "deploy" já com frontend/dist pronto, evitando
# rodar o vite build no servidor (que falha por limite de memória do runner).
name: Build frontend e publicar branch deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências do frontend
        run: npm ci --prefix frontend

      - name: Build do frontend
        run: npm run build --prefix frontend

      - name: Publica branch deploy (código + frontend/dist)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist
          git commit -m "build: frontend dist de ${GITHUB_SHA::7}"
          git push -f origin HEAD:deploy
