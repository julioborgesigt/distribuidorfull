# CI: roda os testes do backend e valida o frontend (lint + build) em cada
# push (exceto na branch auto-gerada "deploy") e em cada pull request.
name: CI

on:
  push:
    branches-ignore:
      - deploy
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (checagem + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Checagem de sintaxe
        run: npm run check

      - name: Testes (jest)
        # Sem --coverage aqui para não travar por limiar; os models são
        # mockados nos testes, então não é necessário um MySQL.
        run: npx jest
        env:
          NODE_ENV: test
          JWT_SECRET: ci-dummy-secret-please-ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci

      # O build (Vite) é o que pega erro real de template/script antes do merge.
      # O lint (eslint) não é enforçado aqui porque o script do projeto usa
      # `--fix` e o código tem estilo pendente de auto-correção; para ligar o
      # lint no CI, rode `npm run lint` uma vez para zerar o estilo e commite.
      - name: Build (Vite)
        run: npm run build
